<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PDF 模板編輯與打包工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js 用於前端預覽與點擊 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <!-- pdf-lib 用於將設定寫入 PDF 檔案中 -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 左側控制面板 -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-1 space-y-4">
            <h1 class="text-xl font-bold text-gray-800">1. PDF 模板編輯器</h1>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上傳原始 PDF 檔案</label>
                <input type="file" id="pdfFile" accept="application/pdf" class="w-full text-sm text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">2. 未來伺服器上的檔案名稱/網址</label>
                <input type="text" id="targetUrl" placeholder="https://example.com/form-template.pdf" class="w-full p-2 border rounded-lg text-sm">
                <p class="text-xs text-gray-400 mt-1">此網址會與座標一起被加密到 Token 中。</p>
            </div>

            <hr>

            <div>
                <h2 class="text-md font-semibold mb-2">3. 已標註的欄位列表</h2>
                <div id="fieldsList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400">尚未新增欄位，請在右側 PDF 畫面上點擊。</p>
                </div>
            </div>

            <hr>

            <button onclick="downloadTemplateAndConfig()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">下載帶有設定的 PDF 模板</button>
            
            <div id="resultSection" class="hidden space-y-2 bg-gray-50 p-3 rounded border">
                <label class="block text-xs font-bold text-gray-700">對應的 Token 字串（供手動 Base64 轉換使用）：</label>
                <textarea id="rawJsonText" readonly class="w-full p-2 border rounded bg-white text-[10px] h-16 font-mono"></textarea>
            </div>
        </div>

        <!-- 右側 PDF 預覽與標註區 -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-2 flex flex-col items-center overflow-auto min-h-[600px]">
            <h2 class="text-md font-semibold text-gray-700 mb-2 self-start">4. 點擊 PDF 頁面來標註填寫位置</h2>
            <div id="pdfContainer" class="relative border shadow-inner bg-gray-200 cursor-crosshair">
                <p id="placeholderText" class="text-gray-400 p-20">請先在左側上傳 PDF 以顯示預覽</p>
                <canvas id="pdfCanvas"></canvas>
                <div id="markersLayer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
            </div>
        </div>
    </div>

    <script>
        let pdfDocJs = null;
        let originalArrayBuffer = null;
        let scale = 1.2;
        let fields = [];
        let currentPdfPage = 1;

        document.getElementById('pdfFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originalArrayBuffer = await file.arrayBuffer();
            const typedarray = new Uint8Array(originalArrayBuffer);
            
            pdfDocJs = await pdfjsLib.getDocument(typedarray).promise;
            document.getElementById('placeholderText').style.display = 'none';
            renderPage(currentPdfPage);
        });

        async function renderPage(num) {
            const page = await pdfDocJs.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        // 點擊畫布取得點位
        document.getElementById('pdfCanvas').addEventListener('click', function(event) {
            if (!pdfDocJs) return;

            const rect = this.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const fieldName = prompt("請輸入這個欄位的名稱（例如：姓名、電話）：");
            if (!fieldName) return;

            fields.push({
                key: fieldName,
                x: Math.round(clickX / scale),
                y: Math.round(clickY / scale),
                page: currentPdfPage - 1
            });

            updateFieldsUI();
        });

        function updateFieldsUI() {
            const container = document.getElementById('fieldsList');
            const markersLayer = document.getElementById('markersLayer');
            
            container.innerHTML = '';
            markersLayer.innerHTML = '';

            if (fields.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400">尚未新增欄位。</p>';
                return;
            }

            fields.forEach((field, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-2 rounded border text-sm";
                div.innerHTML = `
                    <span><b>${field.key}</b> (X:${field.x}, Y:${field.y})</span>
                    <button onclick="removeField(${index})" class="text-red-500 font-bold px-2 hover:bg-red-50 rounded">✕</button>
                `;
                container.appendChild(div);

                const marker = document.createElement('div');
                marker.className = "absolute bg-red-500 text-white text-[10px] px-1 rounded-full shadow border border-white pointer-events-none transform -translate-x-1/2 -translate-y-1/2";
                marker.style.left = `${field.x * scale}px`;
                marker.style.top = `${field.y * scale}px`;
                marker.innerText = field.key;
                markersLayer.appendChild(marker);
            });
        }

        function removeField(index) {
            fields.splice(index, 1);
            updateFieldsUI();
        }

        async function downloadTemplateAndConfig() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            if (!targetUrl) {
                alert('請先填寫未來檔案在伺服器上的網址！');
                return;
            }
            if (fields.length === 0) {
                alert('請至少在 PDF 上標註一個欄位！');
                return;
            }

            // 組合配置物件
            const configData = {
                url: targetUrl,
                fields: fields
            };

            // 產生供手動加密的 JSON 字串
            const jsonString = JSON.stringify(configData);
            document.getElementById('rawJsonText').value = jsonString;
            document.getElementById('resultSection').classList.remove('hidden');

            // 同時下載原始 PDF（你可以直接拿這個去上傳到你的伺服器）
            const blob = new Blob([originalArrayBuffer], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'form-template.pdf';
            link.click();

            alert('PDF 模板已下載！請將它上傳到你的伺服器，並使用左側顯示的 JSON 內容進行手動 Base64 加密後放入 ?token= 即可。');
        }
    </script>
</body>
</html>
