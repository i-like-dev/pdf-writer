<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PDF 視覺化模板產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 PDF.js 用於前端渲染 PDF 預覽畫面 -->
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- 左側：控制面板與欄位列表 -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-1 space-y-4">
            <h1 class="text-xl font-bold text-gray-800">1. 設定 PDF 模板</h1>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上傳原始 PDF 檔案</label>
                <input type="file" id="pdfFile" accept="application/pdf" class="w-full text-sm text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">2. 你的伺服器上的 PDF 公開網址 (URL)</label>
                <input type="text" id="pdfUrl" placeholder="https://example.com/form.pdf" class="w-full p-2 border rounded-lg text-sm">
                <p class="text-xs text-gray-400 mt-1">請先將 PDF 上傳至伺服器並貼上網址，供訪客下載。</p>
            </div>

            <hr>

            <div>
                <h2 class="text-md font-semibold mb-2">3. 欄位列表（點擊右側 PDF 畫面自動新增）</h2>
                <div id="fieldsList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400">尚未新增欄位，請在右側 PDF 點擊要填寫的位置。</p>
                </div>
            </div>

            <hr>

            <button onclick="generateTokenLink()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">產生加密 Token 連結</button>
            
            <div id="resultSection" class="hidden space-y-2">
                <label class="block text-sm font-medium text-gray-700">訪客專屬連結：</label>
                <textarea id="shareLink" readonly class="w-full p-2 border rounded bg-gray-50 text-xs h-20"></textarea>
                <a id="previewBtn" href="#" target="_blank" class="block text-center bg-green-600 text-white py-2 rounded text-sm font-semibold hover:bg-green-700">點此測試訪客填寫頁面</a>
            </div>
        </div>

        <!-- 右側：PDF 視覺化互動預覽區 -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-2 flex flex-col items-center overflow-auto min-h-[600px]">
            <h2 class="text-md font-semibold text-gray-700 mb-2 self-start">4. 點擊 PDF 頁面來標註欄位位置</h2>
            <div id="pdfContainer" class="relative border shadow-inner bg-gray-200 cursor-crosshair">
                <p id="placeholderText" class="text-gray-400 p-20">請先在左側上傳 PDF 以顯示預覽</p>
                <canvas id="pdfCanvas"></canvas>
                <!-- 放置標記點的容器 -->
                <div id="markersLayer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
            </div>
        </div>
    </div>

    <script>
        let pdfDoc = null;
        let scale = 1.2; // 預覽放大倍率
        let fields = [];
        let currentPdfPage = 1;

        document.getElementById('pdfFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
                document.getElementById('placeholderText').style.display = 'none';
                renderPage(currentPdfPage);
            };
            fileReader.readAsArrayBuffer(file);
        });

        async function renderPage(num) {
            const page = await pdfDoc.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            await page.render(renderContext).promise;
        }

        // 點擊 Canvas 畫布取得座標
        document.getElementById('pdfCanvas').addEventListener('click', function(event) {
            if (!pdfDoc) return;

            const rect = this.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            // 讓使用者輸入欄位名稱
            const fieldName = prompt("請輸入這個欄位的名稱（例如：姓名、身分證字號）：");
            if (!fieldName) return;

            // 將點擊的 Canvas 像素座標，轉換回 PDF 實際座標（PDF 預設以點 Point 計算，且 Y 軸方向相反）
            // 這裡記錄相對於畫布比例的座標，以便後端/前端填寫時對應
            const x = clickX / scale;
            const y = clickY / scale;

            fields.push({
                key: fieldName,
                x: Math.round(x),
                y: Math.round(y),
                page: currentPdfPage - 1
            });

            updateFieldsUI();
        });

        function updateFieldsUI() {
            const container = document.getElementById('fieldsList');
            const markersLayer = document.getElementById('markersLayer');
            
            container.innerHTML = '';
            markersLayer.innerHTML = '';

            if (fields.length === 0) {
                container.innerHTML = '<p class="text-xs text-gray-400">尚未新增欄位。</p>';
                return;
            }

            fields.forEach((field, index) => {
                // 左側清單項目
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-2 rounded border text-sm";
                div.innerHTML = `
                    <span><b>${field.key}</b> (X:${field.x}, Y:${field.y})</span>
                    <button onclick="removeField(${index})" class="text-red-500 font-bold px-2 hover:bg-red-50 rounded">✕</button>
                `;
                container.appendChild(div);

                // 右側預覽畫面上的定位標記點
                const marker = document.createElement('div');
                marker.className = "absolute bg-red-500 text-white text-[10px] px-1 rounded-full shadow border border-white pointer-events-none transform -translate-x-1/2 -translate-y-1/2";
                marker.style.left = `${field.x * scale}px`;
                marker.style.top = `${field.y * scale}px`;
                marker.innerText = field.key;
                markersLayer.appendChild(marker);
            });
        }

        function removeField(index) {
            fields.splice(index, 1);
            updateFieldsUI();
        }

        function generateTokenLink() {
            const pdfUrl = document.getElementById('pdfUrl').value.trim();
            if (!pdfUrl) {
                alert('請先填寫伺服器上的 PDF 檔案公開網址！');
                return;
            }
            if (fields.length === 0) {
                alert('請至少在 PDF 上點擊新增一個填寫欄位！');
                return;
            }

            const configData = {
                url: pdfUrl,
                fields: fields
            };

            // 轉成 JSON 並進行 Base64 加密 (支援中文)
            const jsonString = JSON.stringify(configData);
            const base64Token = btoa(unescape(encodeURIComponent(jsonString)));

            const baseUrl = window.location.href.replace('admin.html', 'index.html');
            const finalLink = `${baseUrl}?token=${base64Token}`;

            document.getElementById('shareLink').value = finalLink;
            document.getElementById('previewBtn').href = finalLink;
            document.getElementById('resultSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
