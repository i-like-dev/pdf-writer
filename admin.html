<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PDF 模板連結產生器</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">2. 產生訪客填寫連結</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">1. 你的伺服器上的 PDF 檔案公開網址 (URL)</label>
                <input type="text" id="pdfUrl" placeholder="https://example.com/templates/form.pdf" class="w-full p-2 border rounded-lg">
            </div>

            <hr class="my-4">

            <div>
                <h2 class="text-lg font-semibold mb-2">2. 設定填寫欄位與座標</h2>
                <div id="fieldsContainer" class="space-y-3 mb-4">
                    <!-- 動態新增欄位 -->
                </div>
                <button onclick="addField()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300">+ 新增欄位</button>
            </div>
            
            <hr class="my-4">
            
            <button onclick="generateTokenLink()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">產生加密 Token 連結</button>
            
            <div id="resultSection" class="mt-4 hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">加密後的訪客專屬連結：</label>
                <input type="text" id="shareLink" readonly class="w-full p-2 border rounded bg-gray-100 text-sm mb-2">
                <a id="previewBtn" href="#" target="_blank" class="inline-block text-blue-600 underline text-sm">點此測試填寫頁面</a>
            </div>
        </div>
    </div>

    <script>
        function addField() {
            const container = document.getElementById('fieldsContainer');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-gray-50 p-3 rounded-lg border";
            div.innerHTML = `
                <input type="text" placeholder="欄位名稱 (例如: 姓名)" class="field-key flex-1 p-2 border rounded bg-white">
                <div>
                    <label class="text-xs text-gray-500 block">X 座標</label>
                    <input type="number" placeholder="X" class="field-x w-20 p-2 border rounded bg-white" value="100">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block">Y 座標</label>
                    <input type="number" placeholder="Y" class="field-y w-20 p-2 border rounded bg-white" value="100">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block">頁碼 (從0開始)</label>
                    <input type="number" placeholder="頁碼" class="field-page w-20 p-2 border rounded bg-white" value="0">
                </div>
                <button onclick="this.parentElement.remove()" class="text-red-500 font-bold px-2 self-end mb-1">✕</button>
            `;
            container.appendChild(div);
        }

        // 預設先加一個欄位示範
        addField();

        function generateTokenLink() {
            const pdfUrl = document.getElementById('pdfUrl').value.trim();
            if (!pdfUrl) {
                alert('請先輸入伺服器上的 PDF 網址！');
                return;
            }

            const fieldElements = document.querySelectorAll('#fieldsContainer > div');
            const fields = [];
            fieldElements.forEach(el => {
                fields.push({
                    key: el.querySelector('.field-key').value,
                    x: parseFloat(el.querySelector('.field-x').value),
                    y: parseFloat(el.querySelector('.field-y').value),
                    page: parseInt(el.querySelector('.field-page').value)
                });
            });

            // 將 PDF 網址與欄位設定組合成物件
            const configData = {
                url: pdfUrl,
                fields: fields
            };
            
            // 轉成 JSON 並進行 Base64 加密 (支援中文)
            const jsonString = JSON.stringify(configData);
            const base64Token = btoa(unescape(encodeURIComponent(jsonString)));

            // 組合 GitHub Pages 的 `index.html` 網址
            const baseUrl = window.location.href.replace('admin.html', 'index.html');
            const finalLink = `${baseUrl}?token=${base64Token}`;

            document.getElementById('shareLink').value = finalLink;
            document.getElementById('previewBtn').href = finalLink;
            document.getElementById('resultSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
