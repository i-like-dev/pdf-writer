<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>專業 PDF 表單視覺化設計器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- 左側控制面板 -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-1 space-y-4">
            <h1 class="text-xl font-bold text-gray-800">1. 設定表單</h1>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上傳原始 PDF</label>
                <input type="file" id="pdfFile" accept="application/pdf" class="w-full text-xs text-gray-500 file:py-2 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">伺服器上的 PDF 網址</label>
                <input type="text" id="targetUrl" placeholder="https://example.com/form.pdf" class="w-full p-2 border rounded text-sm">
            </div>

            <hr>

            <h2 class="text-md font-semibold text-gray-700">2. 新增欄位屬性</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500 block">欄位名稱/標題</label>
                    <input type="text" id="fieldKey" placeholder="例如：姓名、性別" class="w-full p-2 border rounded text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block">欄位類型</label>
                    <select id="fieldType" class="w-full p-2 border rounded text-sm bg-white" onchange="toggleFieldOptions()">
                        <option value="text">一般文字輸入</option>
                        <option value="date">自動帶入今天日期 (可手動修改)</option>
                        <option value="checkbox">勾選框 (打勾)</option>
                        <option value="select">下拉選單 (選項用逗號隔開)</option>
                    </select>
                </div>
                <div id="optionsGroup" class="hidden">
                    <label class="text-xs text-gray-500 block">選項 (以半形逗號分隔)</label>
                    <input type="text" id="fieldOptions" placeholder="選項A,選項B,選項C" class="w-full p-2 border rounded text-sm">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-gray-500 block">寬度 (px)</label>
                        <input type="number" id="fieldWidth" value="150" class="w-full p-2 border rounded text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500 block">高度 (px)</label>
                        <input type="number" id="fieldHeight" value="25" class="w-full p-2 border rounded text-sm">
                    </div>
                </div>
                <p class="text-[11px] text-blue-600 bg-blue-50 p-2 rounded">💡 設定好上方屬性後，直接在右側 PDF 畫面上點擊想放置的位置！</p>
            </div>

            <hr>

            <div>
                <h3 class="text-sm font-semibold mb-2">已建立的欄位</h3>
                <div id="fieldsList" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400">尚無欄位</p>
                </div>
            </div>

            <button onclick="downloadTemplateAndJson()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 text-sm">下載 PDF 與產生 JSON</button>
            
            <div id="resultSection" class="hidden space-y-2 bg-gray-50 p-3 rounded border">
                <label class="text-[11px] font-bold text-gray-700">對應的 JSON 設定（請自行 Base64 加密）：</label>
                <textarea id="rawJsonText" readonly class="w-full p-2 border rounded bg-white text-[10px] h-20 font-mono"></textarea>
            </div>
        </div>

        <!-- 右側預覽與點擊區 -->
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-3 flex flex-col items-center overflow-auto min-h-[700px]">
            <h2 class="text-md font-semibold text-gray-700 mb-2 self-start">3. 點擊 PDF 頁面放置欄位</h2>
            <div id="pdfContainer" class="relative border shadow-inner bg-gray-200 cursor-crosshair">
                <p id="placeholderText" class="text-gray-400 p-20">請先在左側上傳 PDF</p>
                <canvas id="pdfCanvas"></canvas>
                <div id="markersLayer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
            </div>
        </div>
    </div>

    <script>
        let pdfDocJs = null;
        let originalArrayBuffer = null;
        let scale = 1.2;
        let fields = [];
        let currentPdfPage = 1;

        document.getElementById('pdfFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalArrayBuffer = await file.arrayBuffer();
            pdfDocJs = await pdfjsLib.getDocument(new Uint8Array(originalArrayBuffer)).promise;
            document.getElementById('placeholderText').style.display = 'none';
            renderPage(currentPdfPage);
        });

        async function renderPage(num) {
            const page = await pdfDocJs.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        function toggleFieldOptions() {
            const type = document.getElementById('fieldType').value;
            document.getElementById('optionsGroup').style.display = type === 'select' ? 'block' : 'none';
        }

        document.getElementById('pdfCanvas').addEventListener('click', function(event) {
            if (!pdfDocJs) return;
            const key = document.getElementById('fieldKey').value.trim();
            if (!key) {
                alert('請先在左側輸入「欄位名稱/標題」再點擊畫面！');
                return;
            }

            const rect = this.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const clickY = event.clientY - rect.top;

            const type = document.getElementById('fieldType').value;
            const options = document.getElementById('fieldOptions').value.split(',').map(s => s.trim()).filter(Boolean);
            const width = parseInt(document.getElementById('fieldWidth').value) || 150;
            const height = parseInt(document.getElementById('fieldHeight').value) || 25;

            fields.push({
                key,
                type,
                options: type === 'select' ? options : [],
                x: Math.round(clickX / scale),
                y: Math.round(clickY / scale),
                width,
                height,
                page: currentPdfPage - 1
            });

            updateFieldsUI();
        });

        function updateFieldsUI() {
            const container = document.getElementById('fieldsList');
            const markersLayer = document.getElementById('markersLayer');
            container.innerHTML = '';
            markersLayer.innerHTML = '';

            fields.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-2 rounded border text-xs";
                div.innerHTML = `<span><b>${f.key}</b> (${f.type})</span> <button onclick="fields.splice(${index},1);updateFieldsUI()" class="text-red-500 font-bold px-1">✕</button>`;
                container.appendChild(div);

                const marker = document.createElement('div');
                marker.className = "absolute border-2 border-blue-500 bg-blue-200 bg-opacity-40 text-blue-900 text-[10px] flex items-center px-1 pointer-events-none";
                marker.style.left = `${f.x * scale}px`;
                marker.style.top = `${f.y * scale}px`;
                marker.style.width = `${f.width * scale}px`;
                marker.style.height = `${f.height * scale}px`;
                marker.innerText = f.key;
                markersLayer.appendChild(marker);
            });
        }

        function downloadTemplateAndJson() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            if (!targetUrl) { alert('請填寫伺服器上的 PDF 網址！'); return; }
            if (fields.length === 0) { alert('請至少在畫面上建立一個欄位！'); return; }

            const configData = { url: targetUrl, fields };
            document.getElementById('rawJsonText').value = JSON.stringify(configData);
            document.getElementById('resultSection').classList.remove('hidden');

            const blob = new Blob([originalArrayBuffer], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'form-template.pdf';
            link.click();
        }
    </script>
</body>
</html>
