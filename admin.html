<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>PDF 專業表單設計器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-1 space-y-4">
            <h1 class="text-xl font-bold text-gray-800">1. 表單設定</h1>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">上傳原始 PDF</label>
                <input type="file" id="pdfFile" accept="application/pdf" class="w-full text-xs text-gray-500 file:py-2 file:px-3 file:rounded file:border-0 file:bg-blue-50 file:text-blue-700"/>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">伺服器上的 PDF 網址</label>
                <input type="text" id="targetUrl" placeholder="https://cdn.techmeow.tw/files/pass.pdf" class="w-full p-2 border rounded text-sm">
            </div>

            <hr>

            <h2 class="text-md font-semibold text-gray-700">2. 欄位類型選擇</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-gray-500 block">欄位名稱/標題</label>
                    <input type="text" id="fieldKey" placeholder="例如：申請人姓名" class="w-full p-2 border rounded text-sm">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block">文字/元件類型</label>
                    <select id="fieldType" class="w-full p-2 border rounded text-sm bg-white" onchange="toggleFieldOptions()">
                        <option value="text">一般文字 (靠左)</option>
                        <option value="textarea">多行文字事由 (自動換行)</option>
                        <option value="center">置中文字 (姓名/日期)</option>
                        <option value="right">靠右對齊 (金額/數字)</option>
                        <option value="date">自動帶入今天日期</option>
                        <option value="checkbox">勾選框 (打勾 V)</option>
                        <option value="select">下拉選單</option>
                    </select>
                </div>
                <div id="optionsGroup" class="hidden">
                    <label class="text-xs text-gray-500 block">選項 (逗號分隔)</label>
                    <input type="text" id="fieldOptions" placeholder="選項A,選項B" class="w-full p-2 border rounded text-sm">
                </div>
                <p class="text-[11px] text-blue-600 bg-blue-50 p-2 rounded">💡 設定後，在右側畫面上**按住滑鼠拖曳**畫出範圍即可！</p>
            </div>

            <hr>

            <div>
                <h3 class="text-sm font-semibold mb-2">已建立的欄位</h3>
                <div id="fieldsList" class="space-y-2 max-h-36 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400">尚無欄位</p>
                </div>
            </div>

            <button onclick="generateShortConfig()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 text-sm">產生短 Token 與設定檔</button>
            
            <div id="resultSection" class="hidden space-y-2 bg-gray-50 p-3 rounded border">
                <label class="text-[11px] font-bold text-gray-700">超短 Token 參數（直接貼在 ?token= 後面）：</label>
                <input type="text" id="shortTokenInput" readonly class="w-full p-1 border rounded bg-white text-xs font-mono">
                <p class="text-[10px] text-gray-500">同時也會自動下載 JSON 設定檔，請上傳至伺服器與 PDF 同資料夾。</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-md md:col-span-3 flex flex-col items-center overflow-auto min-h-[700px]">
            <h2 class="text-md font-semibold text-gray-700 mb-2 self-start">3. 在 PDF 畫面上按住拖曳以建立欄位</h2>
            <div id="pdfContainer" class="relative border shadow-inner bg-gray-200 select-none cursor-crosshair">
                <p id="placeholderText" class="text-gray-400 p-20">請先在左側上傳 PDF</p>
                <canvas id="pdfCanvas"></canvas>
                <div id="markersLayer" class="absolute top-0 left-0 w-full h-full pointer-events-none"></div>
                <div id="drawingBox" class="absolute border-2 border-dashed border-blue-600 bg-blue-400 bg-opacity-30 hidden pointer-events-none"></div>
            </div>
        </div>
    </div>

    <script>
        let pdfDocJs = null;
        let originalArrayBuffer = null;
        let scale = 1.2;
        let fields = [];
        let currentPdfPage = 1;

        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;

        document.getElementById('pdfFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalArrayBuffer = await file.arrayBuffer();
            pdfDocJs = await pdfjsLib.getDocument(new Uint8Array(originalArrayBuffer)).promise;
            document.getElementById('placeholderText').style.display = 'none';
            renderPage(currentPdfPage);
        });

        async function renderPage(num) {
            const page = await pdfDocJs.getPage(num);
            const viewport = page.getViewport({ scale: scale });
            const canvas = document.getElementById('pdfCanvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        function toggleFieldOptions() {
            const type = document.getElementById('fieldType').value;
            document.getElementById('optionsGroup').style.display = type === 'select' ? 'block' : 'none';
        }

        const canvasEl = document.getElementById('pdfCanvas');

        canvasEl.addEventListener('mousedown', (e) => {
            if (!pdfDocJs) return;
            const key = document.getElementById('fieldKey').value.trim();
            if (!key) { alert('請先輸入欄位名稱！'); return; }
            const rect = canvasEl.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;
        });

        canvasEl.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const rect = canvasEl.getBoundingClientRect();
            currentX = e.clientX - rect.left;
            currentY = e.clientY - rect.top;
            const box = document.getElementById('drawingBox');
            box.style.display = 'block';
            box.style.left = `${Math.min(startX, currentX)}px`;
            box.style.top = `${Math.min(startY, currentY)}px`;
            box.style.width = `${Math.abs(currentX - startX)}px`;
            box.style.height = `${Math.abs(currentY - startY)}px`;
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            document.getElementById('drawingBox').style.display = 'none';

            const rect = canvasEl.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            const rawLeft = Math.min(startX, endX);
            const rawTop = Math.min(startY, endY);
            const rawWidth = Math.abs(endX - startX);
            const rawHeight = Math.abs(endY - startY);

            if (rawWidth < 10 || rawHeight < 10) return;

            fields.push({
                key: document.getElementById('fieldKey').value.trim(),
                type: document.getElementById('fieldType').value,
                options: document.getElementById('fieldType').value === 'select' ? document.getElementById('fieldOptions').value.split(',').map(s=>s.trim()).filter(Boolean) : [],
                x: Math.round(rawLeft / scale),
                y: Math.round(rawTop / scale),
                width: Math.round(rawWidth / scale),
                height: Math.round(rawHeight / scale),
                page: currentPdfPage - 1
            });
            updateFieldsUI();
        });

        function updateFieldsUI() {
            const container = document.getElementById('fieldsList');
            const markersLayer = document.getElementById('markersLayer');
            container.innerHTML = '';
            markersLayer.innerHTML = '';

            fields.forEach((f, index) => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-gray-50 p-2 rounded border text-xs";
                div.innerHTML = `<span><b>${f.key}</b> (${f.type})</span> <button onclick="fields.splice(${index},1);updateFieldsUI()" class="text-red-500 font-bold px-1">✕</button>`;
                container.appendChild(div);

                const marker = document.createElement('div');
                marker.className = "absolute border-2 border-blue-500 bg-blue-200 bg-opacity-40 text-blue-900 text-[10px] flex items-center px-1 pointer-events-none";
                marker.style.left = `${f.x * scale}px`;
                marker.style.top = `${f.y * scale}px`;
                marker.style.width = `${f.width * scale}px`;
                marker.style.height = `${f.height * scale}px`;
                marker.innerText = f.key;
                markersLayer.appendChild(marker);
            });
        }

        function generateShortConfig() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            if (!targetUrl) { alert('請填寫 PDF 伺服器網址！'); return; }
            if (fields.length === 0) { alert('請至少建立一個欄位！'); return; }

            const configData = { url: targetUrl, fields };
            const jsonString = JSON.stringify(configData);

            // 將 JSON 網址本身進行 Base64（或直接將 JSON 檔案放在伺服器，token 僅傳 JSON 檔案的網址即可讓 token 變超短！）
            // 這裡我們採用最聰明的做法：token 直接放 JSON 設定檔的網址（或對 JSON 網址進行 Base64，極短！）
            const tokenVal = btoa(targetUrl.replace('.pdf', '.json')); // 讓 token 只包含設定檔網址的縮寫
            
            document.getElementById('shortTokenInput').value = tokenVal;
            document.getElementById('resultSection').classList.remove('hidden');

            // 自動下載該設定檔 JSON，你只要跟 PDF 一起上傳到伺服器即可！
            const jsonBlob = new Blob([jsonString], { type: 'application/json' });
            const jsonLink = document.createElement('a');
            jsonLink.href = URL.createObjectURL(jsonBlob);
            jsonLink.download = 'form-config.json';
            jsonLink.click();
        }
    </script>
</body>
</html>
