<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>線上表單填寫與下載</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit/dist/fontkit.umd.js"></script>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-2 text-gray-800">請填寫表單內容</h1>
        <p id="loadingStatus" class="text-sm text-gray-500 mb-6">正在載入設定...</p>
        
        <div id="formContainer" class="space-y-4 mb-6"></div>

        <button id="submitBtn" onclick="submitForm()" disabled class="w-full bg-gray-400 text-white py-3 rounded-lg font-semibold cursor-not-allowed">載入中...</button>
    </div>

    <script>
        let configData = null;

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (!token) {
                document.getElementById('loadingStatus').innerText = '錯誤：缺少 token 參數。';
                return;
            }

            try {
                // 解碼出對應的 JSON 設定檔網址（例如 pass.json）
                const configJsonUrl = atob(token);
                const res = await fetch(configJsonUrl);
                if (!res.ok) throw new Error('無法讀取遠端設定檔 JSON');
                configData = await res.json();

                const container = document.getElementById('formContainer');
                container.innerHTML = '';
                const todayStr = new Date().toISOString().split('T')[0];

                configData.fields.forEach((field, index) => {
                    const div = document.createElement('div');
                    let inputHtml = '';

                    if (field.type === 'checkbox') {
                        inputHtml = `
                            <label class="flex items-center space-x-2 cursor-pointer mt-2">
                                <input type="checkbox" id="input-${index}" class="w-5 h-5 text-blue-600 rounded">
                                <span class="text-sm font-medium text-gray-700">勾選：${field.key}</span>
                            </label>
                        `;
                    } else if (field.type === 'select') {
                        let optionsHtml = field.options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
                        inputHtml = `
                            <label class="block text-sm font-medium text-gray-700 mb-1">${field.key}</label>
                            <select id="input-${index}" class="w-full p-2 border rounded-lg bg-white focus:ring-2 focus:ring-blue-500">${optionsHtml}</select>
                        `;
                    } else if (field.type === 'date') {
                        inputHtml = `
                            <label class="block text-sm font-medium text-gray-700 mb-1">${field.key}</label>
                            <input type="date" id="input-${index}" value="${todayStr}" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
                        `;
                    } else if (field.type === 'textarea') {
                        inputHtml = `
                            <label class="block text-sm font-medium text-gray-700 mb-1">${field.key} (多行)</label>
                            <textarea id="input-${index}" rows="4" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="請輸入 ${field.key}"></textarea>
                        `;
                    } else {
                        inputHtml = `
                            <label class="block text-sm font-medium text-gray-700 mb-1">${field.key} <span class="text-xs text-gray-400">(${field.type})</span></label>
                            <input type="text" id="input-${index}" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="請輸入 ${field.key}">
                        `;
                    }

                    div.innerHTML = inputHtml;
                    container.appendChild(div);
                });

                document.getElementById('loadingStatus').innerText = `載入成功，共 ${configData.fields.length} 個欄位。`;
                const btn = document.getElementById('submitBtn');
                btn.disabled = false;
                btn.className = "w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 cursor-pointer";

            } catch (e) {
                console.error(e);
                document.getElementById('loadingStatus').innerText = '錯誤：無法載入設定檔（請確認 Token 與 JSON 網址是否正確）。';
            }
        };

        async function submitForm() {
            if (!configData) return;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '處理中...';

            try {
                const response = await fetch(configData.url);
                if (!response.ok) throw new Error('無法下載遠端 PDF 檔案');
                const pdfBytes = await response.arrayBuffer();
                
                const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
                pdfDoc.registerFontkit(fontkit);
                
                // 載入繁體中文「新細名體 (MingLiU / 類似傳統明體風格)」或開源傳統明體字型
                const fontUrl = 'https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-tc@4.5.1/files/noto-serif-tc-chinese-traditional-400-normal.woff';
                const fontBytes = await fetch(fontUrl).then(res => res.arrayBuffer());
                const customFont = await pdfDoc.embedFont(fontBytes);

                const pages = pdfDoc.getPages();

                configData.fields.forEach((field, index) => {
                    const page = pages[field.page];
                    if (!page) return;

                    const targetY = page.getHeight() - field.y - 14;

                    if (field.type === 'checkbox') {
                        const isChecked = document.getElementById(`input-${index}`).checked;
                        if (isChecked) {
                            page.drawText('V', {
                                x: field.x + 4,
                                y: targetY,
                                size: 14,
                                font: customFont,
                            });
                        }
                    } else {
                        const value = document.getElementById(`input-${index}`).value;
                        if (!value) return;

                        const fontSize = 11;
                        const textWidth = customFont.widthOfTextAtSize(value, fontSize);

                        let drawX = field.x + 4;
                        let drawMaxWidth = undefined;

                        // 根據不同的文字類型處理對齊與換行，絕不任意拆字
                        if (field.type === 'center') {
                            // 置中對齊
                            drawX = field.x + (field.width - textWidth) / 2;
                        } else if (field.type === 'right') {
                            // 靠右對齊
                            drawX = field.x + field.width - textWidth - 4;
                        } else if (field.type === 'textarea') {
                            // 多行自動換行
                            drawMaxWidth = field.width - 8;
                        }

                        page.drawText(value, {
                            x: drawX,
                            y: targetY,
                            size: fontSize,
                            font: customFont,
                            maxWidth: drawMaxWidth,
                            lineHeight: 15,
                        });
                    }
                });

                const modifiedPdfBytes = await pdfDoc.save();
                const blob = new Blob([modifiedPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'filled-document.pdf';
                link.click();

                btn.disabled = false;
                btn.innerText = '產出並下載 PDF';

            } catch (error) {
                console.error(error);
                alert('發生錯誤：' + error.message);
                btn.disabled = false;
                btn.innerText = '產出並下載 PDF';
            }
        }
    </script>
</body>
</html>
